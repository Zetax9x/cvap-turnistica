[project]
name = "cvap-turnistica"
version = "0.1.0"
description = "Generazione automatica dei turni settimanali CVAP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ortools>=9.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5"]

[tool.vercel]
entrypoint = "cvap.app:app"
