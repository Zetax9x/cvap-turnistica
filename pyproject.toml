[project]
name = "cvap-turnistica"
version = "0.1.0"
description = "Generazione automatica dei turni settimanali CVAP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ortools>=9.12",
    "libsql>=0.1.11",
    "reportlab>=4.2,<5",
    "tzdata>=2024.1",  # fuso orario di Roma anche dove il sistema non lo ha (Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "pytest-xdist>=3", "pypdf>=5,<7"]

[tool.vercel]
entrypoint = "cvap.app:app"
